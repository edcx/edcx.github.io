<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{ page.title }}</title>
		<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
		<meta name="theme-color" content="#1B1F29">

		<link rel="icon" href="/favicon.ico" sizes="any">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Inter:wght@400;500&display=swap">
		<link rel="stylesheet" type="text/css" href="/css/main.css">
	</head>
	<body>
		<div class="page">

			<nav class="nav">
				<ul>
					<li><a href="/"{% if page.url == "/" %} class="is-current"{% endif %}>Home</a></li>
					<li><a href="/apps/"{% if page.url contains "/apps/" %} class="is-current"{% endif %}>Apps</a></li>
				</ul>
			</nav>

			<main>
			{{ content }}
			</main>

		</div>
	</body>
</html>
